<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f6fb" />
    <title>比邻云 proxima</title>
    <!-- Icons & PWA metas. HREFs are RELATIVE (no leading slash) so they
         resolve under the /proxima/ Pages subpath, not the user root.
         vite-plugin-pwa injects <link rel="manifest"> automatically. -->
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Standard (non-Apple) form first; the apple- prefixed one is kept for
         legacy Safari which ignores the standard one. Both together silence
         the "is deprecated" console warning on every mobile browser. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="比邻云" />

    <!-- Generic OG card — the per-entry pages under /entries/<id>.html carry
         record-specific cards; this is the catch-all for the site root. -->
    <meta property="og:site_name" content="比邻云 proxima" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="比邻云 · 留一条记录在这里" />
    <meta property="og:description" content="公开 / 私密的坐标记录：一张图，一个地点，留给路过的人。" />
    <meta property="og:image" content="pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="text-mist-text" style="background: #f0f6fb">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
