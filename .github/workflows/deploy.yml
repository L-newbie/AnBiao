name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow manual re-deploys / data rebuilds without a source change.
  workflow_dispatch:
  # Auto-deploy roughly every 8 hours so newly uploaded data (on the `data`
  # branch) gets aggregated and published without a manual run or a master
  # push. Note: GitHub Actions schedule uses UTC; off-the-hour minute to
  # dodge the global cron crunch and reduce queueing delay. 8h cadence:
  # 00:37 / 08:37 / 16:37 UTC = 08:37 / 16:37 / 00:37 Beijing time.
  schedule:
    - cron: '37 0,8,16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (master)
        uses: actions/checkout@v4

      - name: Checkout data branch into _data
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Build
        env:
          # The write token is baked into the deployed artifact by Vite.
          # It is scoped to write the `data` branch only (fine-grained PAT).
          VITE_DATA_TOKEN: ${{ secrets.VITE_DATA_TOKEN }}
          VITE_GH_OWNER: ${{ github.repository_owner }}
          VITE_GH_REPO: ${{ github.event.repository.name }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECRET: ${{ secrets.VITE_AMAP_SECRET }}
        run: npm run build
        # aggregate.js runs after vite build and merges _data/ into dist/.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
