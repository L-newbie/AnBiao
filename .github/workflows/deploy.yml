name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow manual re-deploys / data rebuilds without a source change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (master)
        uses: actions/checkout@v4

      - name: Checkout data branch into _data
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 注意：已移除 cache: 'npm'，避免因缺少 package-lock.json 导致 Action 报错挂掉

      # vite & the Vue/Tailwind toolchain live in devDependencies. If NODE_ENV
      # is ever 'production' (set by some Pages templates / repo vars), npm install
      # skips devDependencies and the build fails with `vite: not found`.
      # Force dev deps on regardless of NODE_ENV.
      - name: Install dependencies
        # 注意：已将 npm ci 改为 npm install，使其可以在没有 lock 文件时动态解析并下载依赖
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Build
        env:
          # The write token is baked into the deployed artifact by Vite.
          # It is scoped to write the `data` branch only (fine-grained PAT).
          VITE_DATA_TOKEN: ${{ secrets.VITE_DATA_TOKEN }}
          VITE_GH_OWNER: ${{ github.repository_owner }}
          VITE_GH_REPO: ${{ github.event.repository.name }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECRET: ${{ secrets.VITE_AMAP_SECRET }}
        run: npm run build
        # aggregate.js runs after vite build and merges _data/ into dist/.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
