name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: 
  schedule:
    # 每 10 分钟一次（每小时 6 次），把删除/新增内容对其他设备生效的延迟从最长
    # 1 小时压到最长 10 分钟。
    #
    # 刻意错开整点与 */10 这类"逢十"的时刻：GitHub 的定时任务在整点及常见间隔
    # 上负载最高，会延迟甚至直接跳过。逐个列出分钟数（而不是写 '*/10'）就是为
    # 了落在这些拥堵点之间。
    #
    # 频率上限的考量：GitHub Pages 部署约为每小时 10 次的软限制，6 次留出了余
    # 量给 push 到 master 触发的构建。再往上调之前先确认没有触发限流。
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout data branch into _data
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Build
        env:
          VITE_DATA_TOKEN: ${{ secrets.VITE_DATA_TOKEN }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECRET: ${{ secrets.VITE_AMAP_SECRET }}
          # 动态获取 Owner 和 Repo，兼容 push、手动和定时 schedule 触发
          VITE_GH_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name || github.event.repository.name == '' && github.event.repository.name || 'fallback_name' }} 
        run: |
          # 动态提取纯仓库名（过滤掉用户名/），并写入环境变量中供 Vite 读取
          export VITE_GH_REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          export VITE_REPO_NAME=$VITE_GH_REPO
          npm run build
          echo "==== 验证构建产物 ===="
          ls -la dist # 打印 dist 目录，确保编译成功且有文件

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
