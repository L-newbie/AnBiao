这是优化修改后的完整 YAML 配置文件。主要做了三处关键调整：

1. **将 `npm install` 改为 `npm ci**`：确保严格根据 `package-lock.json` 安装依赖，避免丢 link 或遗漏二进制命令。
2. **开启 `cache: 'npm'**`：加速以后的构建过程。
3. **删除了调试用的 `Verify vite installed` 步骤**：依赖正常安装后无需多余校验。

把 `.github/workflows/deploy.yml` 的内容完整替换为以下代码即可：

```yaml
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow manual re-deploys / data rebuilds without a source change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (master)
        uses: actions/checkout@v4

      - name: Checkout data branch into _data
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # The write token is baked into the deployed artifact by Vite.
          # It is scoped to write the `data` branch only (fine-grained PAT).
          VITE_DATA_TOKEN: ${{ secrets.VITE_DATA_TOKEN }}
          VITE_GH_OWNER: ${{ github.repository_owner }}
          VITE_GH_REPO: ${{ github.event.repository.name }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECRET: ${{ secrets.VITE_AMAP_SECRET }}
        run: npm run build
        # aggregate.js runs after vite build and merges _data/ into dist/.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4

```
